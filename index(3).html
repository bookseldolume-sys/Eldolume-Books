    .card {

      z-index: 2;

      width: 88%;
      display: flex;
      flex-direction: column;
      align-items: center;

      margin-bottom: 30px;
      max-width: 430px;
    }

      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      align-items: center;
    }
    .btn {
      font-family: 'Anton', sans-serif;
      font-size: 1.05rem;
      letter-spacing: 0.04em;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 50px;
      padding: 16px 0;
      width: 300px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background 0.18s;
    }
    .btn:hover { background: #e0e0e0; }
